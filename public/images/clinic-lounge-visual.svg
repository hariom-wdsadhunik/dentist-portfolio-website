<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="loungeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF9F5" />
      <stop offset="100%" stop-color="#F4F0E8" />
    </linearGradient>
    <linearGradient id="forestAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D3B36" />
      <stop offset="100%" stop-color="#082824" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#loungeBg)" />
  <rect x="20" y="20" width="760" height="460" rx="16" fill="none" stroke="#E7E2D8" stroke-width="2" />

  <!-- Soft Interior Wood & Light Lines -->
  <g stroke="#0D3B36" stroke-opacity="0.1" stroke-width="1.5">
    <line x1="80" y1="20" x2="80" y2="480" />
    <line x1="240" y1="20" x2="240" y2="480" />
    <line x1="400" y1="20" x2="400" y2="480" />
    <line x1="560" y1="20" x2="560" y2="480" />
    <line x1="720" y1="20" x2="720" y2="480" />
  </g>

  <!-- Central Lounge Artwork Circle -->
  <circle cx="400" cy="220" r="120" fill="url(#forestAcc)" />
  <circle cx="400" cy="220" r="126" stroke="#D4A373" stroke-width="2" fill="none" opacity="0.6" />

  <!-- Text Overlay -->
  <text x="400" y="210" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    Aura Dental Sanctuary
  </text>
  <text x="400" y="240" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#D4A373" text-anchor="middle">
    Calm Atmosphere • Zero-Wait Standard
  </text>

  <!-- Bottom Details Bar -->
  <rect x="100" y="380" width="600" height="60" rx="12" fill="#FFFFFF" stroke="#E7E2D8" stroke-width="1" />
  <text x="400" y="415" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#0D3B36" text-anchor="middle">
    Complimentary Organic Aromatherapy &amp; Refreshment Lounge
  </text>
</svg>
