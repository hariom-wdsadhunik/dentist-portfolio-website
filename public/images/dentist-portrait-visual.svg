<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="dentistBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1917" />
      <stop offset="50%" stop-color="#0D3B36" />
      <stop offset="100%" stop-color="#082824" />
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E6C594" />
      <stop offset="100%" stop-color="#D4A373" />
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#dentistBg)" />

  <!-- Geometric Frame Lines -->
  <rect x="30" y="30" width="540" height="740" rx="16" fill="none" stroke="#D4A373" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Silhouette Contour Art -->
  <g transform="translate(150, 180)" opacity="0.85">
    <circle cx="150" cy="120" r="70" fill="url(#goldText)" fill-opacity="0.2" stroke="url(#goldText)" stroke-width="2" />
    <path d="M 50,320 C 50,220 100,190 150,190 C 200,190 250,220 250,320 Z" fill="url(#goldText)" fill-opacity="0.15" stroke="url(#goldText)" stroke-width="2" />
  </g>

  <!-- Editorial Text Content -->
  <g transform="translate(60, 560)">
    <rect width="210" height="28" rx="14" fill="#D4A373" fill-opacity="0.2" stroke="#D4A373" stroke-width="1" />
    <text x="105" y="18" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#D4A373" text-anchor="middle" letter-spacing="1">
      FOUNDER &amp; LEAD DENTIST
    </text>

    <text x="0" y="65" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#FFFFFF">
      Dr. Elena Rostova
    </text>
    <text x="0" y="90" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#D4A373">
      DDS, FAGD
    </text>

    <text x="0" y="120" font-family="system-ui, sans-serif" font-size="12" fill="#E7E2D8" opacity="0.8">
      Fellow, Academy of General Dentistry
    </text>
    <text x="0" y="140" font-family="system-ui, sans-serif" font-size="12" fill="#E7E2D8" opacity="0.8">
      15+ Years Patient-Centered Practice in Austin, TX
    </text>
  </g>
</svg>
