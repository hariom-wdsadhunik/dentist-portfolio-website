<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="scanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D3B36" />
      <stop offset="100%" stop-color="#082824" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#scanBg)" />
  <rect x="20" y="20" width="760" height="460" rx="16" fill="none" stroke="#D4A373" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- 3D Digital Mesh Grid Lines -->
  <g stroke="#D4A373" stroke-opacity="0.2" stroke-width="1">
    <path d="M 100,100 Q 400,200 700,100" fill="none" />
    <path d="M 100,200 Q 400,300 700,200" fill="none" />
    <path d="M 100,300 Q 400,400 700,300" fill="none" />
    <line x1="200" y1="50" x2="200" y2="450" stroke-dasharray="4,4" />
    <line x1="400" y1="50" x2="400" y2="450" stroke-dasharray="4,4" />
    <line x1="600" y1="50" x2="600" y2="450" stroke-dasharray="4,4" />
  </g>

  <!-- Pulsing Scanner Node -->
  <circle cx="400" cy="250" r="80" stroke="#D4A373" stroke-width="2" stroke-dasharray="8,8" fill="none" />
  <circle cx="400" cy="250" r="10" fill="#D4A373" />

  <text x="400" y="160" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    3D Digital Optical Scan
  </text>
  <text x="400" y="195" font-family="system-ui, sans-serif" font-size="14" fill="#E7E2D8" text-anchor="middle" opacity="0.9">
    100% Impression-Free • Tens of Thousands of Data Points Per Second
  </text>

  <rect x="150" y="370" width="500" height="50" rx="10" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.2" />
  <text x="400" y="401" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">
    Chairside 3D Screen Reviews with Dr. Rostova
  </text>
</svg>
