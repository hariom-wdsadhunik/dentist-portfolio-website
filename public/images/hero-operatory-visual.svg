<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D3B36" />
      <stop offset="60%" stop-color="#082824" />
      <stop offset="100%" stop-color="#1C1917" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6C594" />
      <stop offset="100%" stop-color="#D4A373" />
    </linearGradient>
    <linearGradient id="linenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBF9F5" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#F4F0E8" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Architectural Grid Patterns -->
  <g stroke="#F4F0E8" stroke-opacity="0.08" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="600" />
    <line x1="300" y1="0" x2="300" y2="600" />
    <line x1="500" y1="0" x2="500" y2="600" />
    <line x1="700" y1="0" x2="700" y2="600" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="450" x2="800" y2="450" />
  </g>

  <!-- Window Sunlight Rays -->
  <polygon points="500,0 800,0 800,450 650,600 350,600" fill="#FBF9F5" fill-opacity="0.03" />

  <!-- Architectural Operatory Chair Frame Graphic -->
  <g transform="translate(150, 180)">
    <!-- Base Platform -->
    <ellipse cx="250" cy="320" rx="180" ry="30" fill="url(#goldGrad)" fill-opacity="0.15" stroke="url(#goldGrad)" stroke-width="1.5" />
    <!-- Chair Contour -->
    <path d="M 120,240 Q 200,200 280,220 T 380,260 T 420,300" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
    <path d="M 140,160 Q 180,100 240,120 T 320,180" fill="none" stroke="#FBF9F5" stroke-width="3" stroke-opacity="0.4" stroke-linecap="round" />
    <!-- 3D Scanner Arc -->
    <circle cx="280" cy="180" r="90" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="6,6" fill="none" opacity="0.6" />
    <circle cx="280" cy="180" r="6" fill="url(#goldGrad)" />
  </g>

  <!-- Editorial Badge Header -->
  <rect x="50" y="50" width="220" height="32" rx="16" fill="url(#goldGrad)" fill-opacity="0.15" stroke="url(#goldGrad)" stroke-width="1" />
  <text x="160" y="71" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#D4A373" text-anchor="middle" letter-spacing="1.5">
    AURA OPERATORY SUITE
  </text>

  <!-- Main Headline Banner -->
  <text x="50" y="130" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#FFFFFF">
    Calm Clinical Precision
  </text>
  <text x="50" y="160" font-family="system-ui, sans-serif" font-size="14" fill="#E7E2D8" opacity="0.8">
    Downtown Austin • 410 Congress Ave, Suite 200
  </text>

  <!-- Bottom Detail Badge -->
  <rect x="50" y="500" width="700" height="60" rx="12" fill="url(#linenGrad)" stroke="#F4F0E8" stroke-opacity="0.15" />
  <text x="80" y="535" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">
    ✓ 3D Intraoral Scanning
  </text>
  <text x="320" y="535" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">
    ✓ 100% Metal-Free Ceramic
  </text>
  <text x="580" y="535" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#D4A373">
    ✓ Zero Hidden Fees
  </text>
</svg>
