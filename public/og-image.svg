<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D3B36" />
      <stop offset="60%" stop-color="#082824" />
      <stop offset="100%" stop-color="#1C1917" />
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E6C594" />
      <stop offset="100%" stop-color="#D4A373" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBg)" />

  <!-- Frame Lines -->
  <rect x="40" y="40" width="1120" height="550" rx="20" fill="none" stroke="url(#goldText)" stroke-width="2" stroke-opacity="0.3" />

  <!-- Badge Header -->
  <rect x="90" y="90" width="280" height="36" rx="18" fill="url(#goldText)" fill-opacity="0.15" stroke="url(#goldText)" stroke-width="1" />
  <text x="230" y="113" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#D4A373" text-anchor="middle" letter-spacing="2">
    AURA DENTAL STUDIO
  </text>

  <!-- Main Headline -->
  <text x="90" y="210" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="#FFFFFF">
    Gentle, Modern Dentistry
  </text>
  <text x="90" y="270" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="url(#goldText)">
    In Bandra West, Mumbai
  </text>

  <!-- Description -->
  <text x="90" y="340" font-family="system-ui, sans-serif" font-size="22" fill="#E7E2D8" opacity="0.9">
    Transparent Co-Care • 3D Digital Impressions • Soothing Comfort Amenities
  </text>

  <!-- Lower Details Grid -->
  <rect x="90" y="450" width="1020" height="90" rx="16" fill="#FBF9F5" fill-opacity="0.08" stroke="#F4F0E8" stroke-opacity="0.2" />

  <text x="130" y="503" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF">
    📍 204, Sea View House, Bandra
  </text>
  <text x="500" y="503" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF">
    📞 +91 98765 43210
  </text>
  <text x="820" y="503" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#D4A373">
    ✨ Sample Portfolio Showcase
  </text>
